<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 茄萣釜山行</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #FDF8F5; /* 溫暖的米粉色背景，呼應插畫風格 */
            color: #333333;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            overflow: hidden;
            padding-bottom: 24px;
        }
        .header-img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 4px solid #F4E8D8;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            color: #2C3E50;
            margin: 20px 0 8px 0;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            color: #7F8C8D;
            font-size: 14px;
            margin: 0 0 20px 0;
        }
        .nav-menu {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            gap: 10px;
        }
        .nav-btn:active {
            transform: scale(0.98);
        }
        /* 星宇航空專屬深藍色 */
        .btn-starlux {
            background-color: #0F2E3C;
        }
        /* 住宿溫暖大地色 */
        .btn-tripmade {
            background-color: #D4A373;
        }
        /* 天氣預報清新天空藍 */
        .btn-weather {
            background-color: #7CA1B4;
        }
        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #BDC3C7;
        }
    </style>
</head>
